[pytest]
testpaths = tests
pythonpath = .
# Tests marked "slow" load the real embedding model; run them with: pytest -m slow
addopts = -ra --strict-markers -m "not slow"
markers =
    slow: loads the real sentence-transformers model (downloads ~90 MB on first run)
filterwarnings =
    ignore::DeprecationWarning:pdfminer.*
    ignore::DeprecationWarning:spacy.*
    ignore::DeprecationWarning:reportlab.*
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
