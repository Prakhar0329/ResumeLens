# ResumeLens: backend (FastAPI, port 8000) + frontend (Next.js, port 3000).
#   docker compose up --build
# Optional settings come from a .env file next to this one (see .env.example).

name: resumelens

services:
  backend:
    build:
      context: ./backend
    image: resumelens-backend:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/resumelens.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      WEIGHT_SKILL: ${WEIGHT_SKILL:-0.50}
      WEIGHT_SEMANTIC: ${WEIGHT_SEMANTIC:-0.35}
      WEIGHT_KEYWORD: ${WEIGHT_KEYWORD:-0.15}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - resumelens-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time: the URL your browser uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: resumelens-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  resumelens-data:
